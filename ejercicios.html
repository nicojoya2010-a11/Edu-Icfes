<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edu Icfes — Quizes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="notification-container"></div>
<div id="levelup-overlay" class="levelup-overlay hidden">
  <div class="levelup-particles" id="levelup-particles"></div>
  <div class="levelup-title">◆ NIVEL ALCANZADO ◆</div>
  <div class="levelup-number" id="lu-number">2</div>
  <div class="levelup-rank" id="lu-rank"></div>
  <button class="btn btn-gold" onclick="closeLevelUp()" style="margin-top:20px;z-index:10;">
    ▶ CONTINUAR
  </button>
</div>

<div class="exercise-layout">

  <!-- Top HUD -->
  <div class="exercise-topbar">
    <button class="back-btn" onclick="goBack()">◀ BASE</button>
    <div class="mini-xp-bar">
      <div class="mini-xp-fill" id="mini-xp" style="width:0%"></div>
    </div>
    <div class="mini-level" id="mini-level">NV.1</div>
    <div class="streak-counter" id="streak-display">🔥 0</div>
  </div>

  <!-- Session Stats -->
  <div class="session-stats">
    <div class="session-stat">
      <span class="session-stat-val" id="ss-correct" style="color:var(--accent-green)">0</span>
      <span class="session-stat-lbl">✓ Correctas</span>
    </div>
    <div class="session-stat">
      <span class="session-stat-val" id="ss-wrong" style="color:var(--accent-red)">0</span>
      <span class="session-stat-lbl">✗ Incorrectas</span>
    </div>
    <div class="session-stat">
      <span class="session-stat-val" id="ss-xp" style="color:var(--accent-cyan)">0</span>
      <span class="session-stat-lbl">XP Ganada</span>
    </div>
    <div class="session-stat">
      <span class="session-stat-val" id="ss-count" style="color:var(--text-secondary)">0</span>
      <span class="session-stat-lbl">Total</span>
    </div>
  </div>

  <!-- Subject Filter -->
  <div class="section-title" style="font-family:var(--font-mono);font-size:0.65rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.2em;display:flex;align-items:center;gap:8px;">
    FILTRAR MATERIA
    <span style="flex:1;height:1px;background:var(--border-dim);display:block;"></span>
  </div>

  <div class="subject-selector" id="subject-selector">
    <button class="subject-select-btn all active" data-subject="all" onclick="setSubject('all', this)">
      <span class="subject-select-icon"></span>
      Todo
    </button>
    <button class="subject-select-btn" data-subject="math" onclick="setSubject('math', this)">
      <span class="subject-select-icon"></span>
      Matemáticas
    </button>
    <button class="subject-select-btn" data-subject="reading" onclick="setSubject('reading', this)">
      <span class="subject-select-icon"></span>
      Lectura
    </button>
    <button class="subject-select-btn" data-subject="english" onclick="setSubject('english', this)">
      <span class="subject-select-icon"></span>
      Inglés
    </button>
    <button class="subject-select-btn" data-subject="science" onclick="setSubject('science', this)">
      <span class="subject-select-icon"></span>
      Ciencias
    </button>
    <button class="subject-select-btn" data-subject="sociales" onclick="setSubject('sociales', this)">
      <span class="subject-select-icon"></span>
      Sociales
    </button>
  </div>

  <!-- Question Area -->
  <div id="question-area">
    <!-- Question card rendered by JS -->
  </div>

</div>

<script src="app.js"></script>
<script>
  // ── Auth guard ──
  const currentUser = requireAuth();
  if (!currentUser) throw new Error('No auth');

  // ── Session state ──
  let session = {
    correct: 0,
    wrong: 0,
    xpGained: 0,
    count: 0,
    answered: false,
    currentQuestion: null,
    currentOptions: null,
    subjectFilter: null,
  };

  // ── Init ──
  function init() {
    // Check URL param for subject
    const params = new URLSearchParams(window.location.search);
    const s = params.get('s');
    if (s && SUBJECTS[s]) {
      setSubject(s, document.querySelector(`[data-subject="${s}"]`));
    }
    updateTopHUD();
    nextQuestion();
  }

  // ── Subject filter ──
  function setSubject(subject, btn) {
    session.subjectFilter = subject === 'all' ? null : subject;
    document.querySelectorAll('.subject-select-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    QuestionEngine.reset();
    nextQuestion();
  }

  // ── Update top HUD ──
  function updateTopHUD() {
    const u = Auth.getCurrentUser();
    const pct = Progress.xpPercent(u);
    document.getElementById('mini-xp').style.width = pct + '%';
    document.getElementById('mini-level').textContent = 'NV.' + u.level;
    document.getElementById('streak-display').textContent = '🔥 ' + (u.streak || 0);
  }

  // ── Next question ──
  function nextQuestion() {
    const q = QuestionEngine.getRandom(session.subjectFilter);
    const { options, correctIndex } = QuestionEngine.getShuffledOptions(q);
    session.currentQuestion = q;
    session.currentOptions = { options, correctIndex };
    session.answered = false;
    renderQuestion(q, options, correctIndex);
  }

  // ── Render question ──
  function renderQuestion(q, options, correctIndex) {
    const sub = SUBJECTS[q.subject];
    const letters = ['A', 'B', 'C', 'D'];

    const optionsHTML = options.map((opt, i) => `
      <button class="answer-option" data-letter="${letters[i]}" data-index="${i}"
              onclick="selectAnswer(${i}, ${correctIndex})">
        ${opt}
      </button>
    `).join('');

    document.getElementById('question-area').innerHTML = `
      <div class="panel question-card">
        <div class="corner-tl"></div>
        <div class="corner-tr"></div>
        <div class="corner-bl"></div>
        <div class="corner-br"></div>

        <div class="question-meta">
          <span class="subject-tag ${sub.tag}">${sub.icon} ${sub.label}</span>
          <span class="question-number">Q.${session.count + 1}</span>
        </div>

        <div class="question-text">${q.question}</div>

        <div class="options-grid" id="options-grid">
          ${optionsHTML}
        </div>

        <div id="explanation-area"></div>

        <div class="next-area hidden" id="next-area">
          <button class="btn btn-primary" onclick="nextQuestion()" style="flex:1;">
            ▶ SIGUIENTE PREGUNTA
          </button>
        </div>
      </div>
    `;
  }

  // ── Answer selection ──
  function selectAnswer(selectedIndex, correctIndex) {
    if (session.answered) return;
    session.answered = true;
    session.count++;

    const isCorrect = selectedIndex === correctIndex;
    const q = session.currentQuestion;
    const u = Auth.getCurrentUser();

    // Disable all options
    document.querySelectorAll('.answer-option').forEach((btn, i) => {
      btn.disabled = true;
      btn.style.pointerEvents = 'none';
      if (i === correctIndex) btn.classList.add('correct');
      if (i === selectedIndex && !isCorrect) btn.classList.add('incorrect');
    });

    // Record answer
    Progress.recordAnswer(u, isCorrect, q.subject);

    // XP reward
    let xpGained = 0;
    if (isCorrect) {
      session.correct++;
      const freshUser = Auth.getCurrentUser();
      const bonus = freshUser.streak > 1 ? XP_BONUS_STREAK : 0;
     const xpGained = recompensaXP(Auth.getCurrentUser().level) + (bonus ? XP_BONUS_STREAK : 0);
      session.xpGained += xpGained;

      // Add XP and check level up
      const levels = Progress.addXP(Auth.getCurrentUser(), xpGained);
      Sound.correct();

      // Show XP float
      showXPReward('+' + xpGained + ' XP' + (bonus ? ' 🔥' : ''));

      // Level up?
      if (levels.length > 0) {
        const newLevel = levels[levels.length - 1];
        setTimeout(() => showLevelUp(newLevel), 800);
      }
    } else {
      session.wrong++;
      // Reset streak
      Sound.incorrect();
    }

    // Achievements
    const newAchs = Progress.checkAchievements(Auth.getCurrentUser());
    newAchs.forEach((ach, i) => {
      setTimeout(() => Notify.achievement(ach), i * 1500);
    });

    // Update session stats
    updateSessionStats();
    updateTopHUD();

    // Explanation
    const expEl = document.getElementById('explanation-area');
    expEl.innerHTML = `
      <div class="explanation-box ${isCorrect ? 'correct-exp' : 'incorrect-exp'}">
        <div class="exp-header">${isCorrect ? '✓ CORRECTO' : '✗ INCORRECTO'}</div>
        ${q.explanation}
      </div>`;

    // Show next button
    document.getElementById('next-area').classList.remove('hidden');
  }

  // ── XP reward float ──
  function showXPReward(text) {
    const el = document.createElement('div');
    el.className = 'xp-reward';
    el.textContent = text;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1500);
  }

  // ── Update session stats ──
  function updateSessionStats() {
    document.getElementById('ss-correct').textContent = session.correct;
    document.getElementById('ss-wrong').textContent = session.wrong;
    document.getElementById('ss-xp').textContent = session.xpGained;
    document.getElementById('ss-count').textContent = session.count;
  }

  // ── Level Up overlay ──
  function showLevelUp(level) {
    const rank = Progress.getRank(level);
    document.getElementById('lu-number').textContent = level;
    document.getElementById('lu-rank').innerHTML =
      `<span style="color:${rank.color}">◆ ${rank.label} · Rango ${rank.rank}</span>`;

    // Spawn particles
    const container = document.getElementById('levelup-particles');
    container.innerHTML = '';
    for (let i = 0; i < 30; i++) {
      const p = document.createElement('div');
      p.className = 'lp';
      p.style.left = '50%';
      p.style.top = '50%';
      const angle = (Math.random() * 360) * (Math.PI / 180);
      const dist = 80 + Math.random() * 200;
      p.style.setProperty('--dest', `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px)`);
      p.style.animationDuration = (0.6 + Math.random() * 0.8) + 's';
      p.style.animationDelay = (Math.random() * 0.3) + 's';
      p.style.background = Math.random() > 0.5 ? '#ffd700' : '#00d4ff';
      container.appendChild(p);
    }

    document.getElementById('levelup-overlay').classList.remove('hidden');
    Sound.levelUp();
    Notify.levelUp(level, rank.rank);
  }

  function closeLevelUp() {
    document.getElementById('levelup-overlay').classList.add('hidden');
  }

  // ── Go back ──
  function goBack() {
    Sound.click();
    window.location.href = 'main.html';
  }

  // ── Keyboard support ──
  document.addEventListener('keydown', (e) => {
    if (session.answered) {
      if (e.key === 'Enter' || e.key === ' ') nextQuestion();
    } else {
      const map = { '1': 0, '2': 1, '3': 2, '4': 3, 'a': 0, 'b': 1, 'c': 2, 'd': 3 };
      const idx = map[e.key.toLowerCase()];
      if (idx !== undefined) {
        const btns = document.querySelectorAll('.answer-option');
        if (btns[idx]) btns[idx].click();
      }
    }
  });

  // ── Start ──
  init();
</script>
</body>
</html>
