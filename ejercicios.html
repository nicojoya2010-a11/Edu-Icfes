<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edu-Icfes — Entrenamiento</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .poderes-strip { display:flex; gap:6px; align-items:center; padding:8px 12px; background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-sm); margin-bottom:10px; overflow-x:auto; }
    .poderes-strip-label { font-family:var(--mono); font-size:.55rem; color:var(--ink-4); letter-spacing:.1em; text-transform:uppercase; flex-shrink:0; }
    .p-btn { display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 10px; border-radius:var(--radius-xs); cursor:pointer; border:1px solid var(--border-md); background:var(--bg-subtle); flex-shrink:0; transition:var(--transition); position:relative; min-width:56px; }
    .p-btn:hover:not([disabled]) { transform:translateY(-2px); box-shadow:var(--glow-b); }
    .p-btn[disabled] { opacity:.3; cursor:not-allowed; }
    .p-btn-icon { font-size:1.1rem; line-height:1; }
    .p-btn-name { font-family:var(--mono); font-size:.5rem; color:var(--ink-3); text-align:center; line-height:1.2; }
    .p-btn-dots { display:flex; gap:2px; }
    .p-dot { width:4px; height:4px; border-radius:50%; }
    .p-btn-cd { font-family:var(--mono); font-size:.44rem; color:var(--ink-4); }
    .p-btn-lock { position:absolute; top:2px; right:3px; font-size:.5rem; }
    .poder-active-bar { display:flex; gap:6px; flex-wrap:wrap; min-height:22px; margin-bottom:6px; }
    .active-pill { display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:20px; font-family:var(--mono); font-size:.62rem; animation:fadeIn .3s ease; }
    .pill-freeze { background:rgba(22,115,255,0.12); border:1px solid rgba(22,115,255,0.3); color:#60a5fa; }
    .pill-2xp    { background:rgba(234,0,255,0.1); border:1px solid rgba(234,0,255,0.3); color:#e879f9; animation:pulse 1s ease-in-out infinite; }
    .poder-flash { position:fixed; top:38%; left:50%; transform:translate(-50%,-50%); font-family:var(--serif); font-size:1.5rem; pointer-events:none; z-index:500; animation:poderFloat 1.7s ease forwards; white-space:nowrap; }
    @keyframes poderFloat { 0%{opacity:0;transform:translate(-50%,-30%) scale(.9);} 15%{opacity:1;transform:translate(-50%,-50%) scale(1.05);} 70%{opacity:1;transform:translate(-50%,-65%);} 100%{opacity:0;transform:translate(-50%,-90%);} }
    #poderes-section { display:none; }
  </style>
</head>
<body>
<div id="notification-container"></div>
<div id="levelup-overlay" class="levelup-overlay hidden">
  <div class="levelup-particles" id="lu-particles"></div>
  <div class="levelup-title">Nivel alcanzado</div>
  <div class="levelup-number" id="lu-num">2</div>
  <div class="levelup-rank" id="lu-rank"></div>
  <button class="btn btn-outline" style="margin-top:20px;color:var(--ink);border-color:rgba(22,115,255,0.4);" onclick="closeLU()">Continuar →</button>
</div>

<div class="page-wrapper">
  <div class="exercise-topbar">
    <button class="back-btn" onclick="goBack()">Base</button>
    <div class="mini-xp-bar"><div class="mini-xp-fill" id="mini-xp" style="width:0%"></div></div>
    <div class="mini-level" id="mini-level">Nv.1</div>
    <div class="streak-pill" id="streak-pill" style="color:var(--ink-2);">🔥 0</div>
  </div>

  <div class="session-stats" style="margin-bottom:10px;">
    <div class="session-stat"><span class="session-stat-val" id="ss-c" style="color:#34d399;">0</span><span class="session-stat-lbl">✓ Ok</span></div>
    <div class="session-stat"><span class="session-stat-val" id="ss-w" style="color:var(--red);">0</span><span class="session-stat-lbl">✗ Fallo</span></div>
    <div class="session-stat"><span class="session-stat-val" id="ss-x" style="background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">0</span><span class="session-stat-lbl">XP</span></div>
    <div class="session-stat"><span class="session-stat-val" id="ss-t" style="color:var(--ink-3);">0</span><span class="session-stat-lbl">Total</span></div>
  </div>

  <!-- Poderes (nivel 10+) -->
  <div id="poderes-section">
    <div class="poder-active-bar" id="active-bar"></div>
    <div class="poderes-strip">
      <div class="poderes-strip-label">Poderes</div>
      <div style="display:flex;gap:5px;" id="poderes-strip-inner"></div>
    </div>
  </div>

  <div class="section-label" style="margin-bottom:6px;">Materia</div>
  <div class="subject-filter" style="margin-bottom:12px;">
    <button class="subject-filter-btn active" data-s="all" onclick="setSub('all',this)">Todo</button>
    <button class="subject-filter-btn" data-s="math" onclick="setSub('math',this)">∑ Mate</button>
    <button class="subject-filter-btn" data-s="reading" onclick="setSub('reading',this)">📖 Lectura</button>
    <button class="subject-filter-btn" data-s="english" onclick="setSub('english',this)">🌐 Inglés</button>
    <button class="subject-filter-btn" data-s="science" onclick="setSub('science',this)">⚗ Ciencias</button>
    <button class="subject-filter-btn" data-s="sociales" onclick="setSub('sociales',this)">🌎 Sociales</button>
  </div>

  <div id="question-area"></div>
</div>

<script src="preguntas.js"></script>
<script src="app.js"></script>
<script>
'use strict';
const ejUser = requireAuth();
if (!ejUser) throw new Error('No auth');

let session = { correct:0, wrong:0, xp:0, count:0, answered:false, q:null, opts:null, sub:null, _noXP:false };

/* ── PODERES ── */
const PDEFS_EJ = [
  { id:'freeze', icon:'❄️', name:'Racha Congelada', key:'Q', color:'#60a5fa', border:'rgba(22,115,255,0.4)', maxCrg:2, cd:4, reqLevel:10 },
  { id:'doble',  icon:'⚡', name:'Doble XP',        key:'W', color:'#e879f9', border:'rgba(234,0,255,0.4)', maxCrg:1, cd:6, reqLevel:20 },
];

let PS_EJ = null;

function initPoderes(u) {
  PS_EJ = {
    cargas:    { freeze: 2+Math.floor(u.level/8), doble: 1+Math.floor(u.level/15) },
    cds:       { freeze:0, doble:0 },
    desde:     { freeze:99, doble:99 },
    freezeOn:  false,
    dobleLeft: 0,
    _level:    u.level,
    puedo(id)  { const def=PDEFS_EJ.find(p=>p.id===id); if(!def||this._level<def.reqLevel) return false; return this.cargas[id]>0&&this.cds[id]===0&&!session.answered; },
    usar(id)   { if(!this.puedo(id)) return false; this.cargas[id]--; this.desde[id]=0; this.cds[id]={freeze:4,doble:6}[id]; return true; },
    tick()     { ['freeze','doble'].forEach(id=>{ this.desde[id]++; this.cds[id]=this.desde[id]>={freeze:4,doble:6}[id]?0:{freeze:4,doble:6}[id]-this.desde[id]; }); if(this.dobleLeft>0) this.dobleLeft--; },
  };
  if (u.level >= 10) document.getElementById('poderes-section').style.display='block';
  renderPoderesEj();
}

function renderPoderesEj() {
  if (!PS_EJ) return;
  const u=Auth.me();
  document.getElementById('poderes-strip-inner').innerHTML = PDEFS_EJ.map(p=>{
    const locked = u.level < p.reqLevel;
    const crg=PS_EJ.cargas[p.id], cd=PS_EJ.cds[p.id], ok=PS_EJ.puedo(p.id);
    const actv = (p.id==='freeze'&&PS_EJ.freezeOn)||(p.id==='doble'&&PS_EJ.dobleLeft>0);
    const dots = Array.from({length:p.maxCrg},(_,i)=>`<div class="p-dot" style="background:${i<crg?p.color:'var(--border-md)'}"></div>`).join('');
    const cdTxt = locked?'':(cd>0?`<div class="p-btn-cd">CD:${cd}</div>`:crg===0&&!actv?`<div class="p-btn-cd">—</div>`:'');
    return `<button class="p-btn" onclick="usarPoderEj('${p.id}')"
      style="${actv||ok?'border-color:'+p.border+';box-shadow:0 0 8px '+p.border+';':''}"
      ${ok&&!locked?'':'disabled'}>
      ${locked?`<div class="p-btn-lock">🔒</div>`:''}
      <div class="p-btn-icon">${p.icon}</div>
      <div class="p-btn-name" style="${actv||ok?'color:'+p.color:''}">${locked?'Nv.'+p.reqLevel:p.name}</div>
      <div class="p-btn-dots">${dots}</div>${cdTxt}
    </button>`;
  }).join('');
  const pills=[];
  if (PS_EJ.freezeOn)    pills.push('<span class="active-pill pill-freeze">❄️ Racha protegida</span>');
  if (PS_EJ.dobleLeft>0) pills.push('<span class="active-pill pill-2xp">⚡ Doble XP ×'+PS_EJ.dobleLeft+'</span>');
  document.getElementById('active-bar').innerHTML = pills.join('');
}

function usarPoderEj(id) {
  if (!PS_EJ||!PS_EJ.puedo(id)) return;
  PS_EJ.usar(id);
  if (id==='freeze') {
    PS_EJ.freezeOn=true;
    flashPoderEj('❄️ ¡Racha Congelada!','#60a5fa');
    Sound.beep(440,.1,'sine',.1); setTimeout(()=>Sound.beep(330,.12,'sine',.1),100);
  }
  if (id==='doble') {
    PS_EJ.dobleLeft=3;
    flashPoderEj('⚡ ¡Doble XP × 3!','#e879f9');
    Sound.beep(660,.08,'square',.1); setTimeout(()=>Sound.beep(880,.1,'square',.1),80);
  }
  renderPoderesEj();
}

function flashPoderEj(txt,color) {
  const el=document.createElement('div'); el.className='poder-flash';
  el.style.cssText='background:'+color+';-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 8px '+color+');';
  el.textContent=txt; document.body.appendChild(el); setTimeout(()=>el.remove(),1700);
}

/* ── INIT ── */
function init() {
  const params = new URLSearchParams(window.location.search);
  const s = params.get('s');
  if (s && SUBJECTS[s]) setSub(s, document.querySelector('[data-s="'+s+'"]'));
  const u = Auth.me();
  initPoderes(u);
  updateHUD(); nextQ();
}

function setSub(sub, btn) {
  session.sub = sub==='all'?null:sub;
  document.querySelectorAll('.subject-filter-btn').forEach(b=>b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  QEngine.reset(); nextQ();
}

function updateHUD() {
  const u=Auth.me();
  document.getElementById('mini-xp').style.width = Progress.xpPct(u)+'%';
  document.getElementById('mini-level').textContent = 'Nv.'+u.level;
  const sp=document.getElementById('streak-pill');
  sp.textContent='🔥 '+(u.streak||0);
  sp.style.color = u.streak>=3 ? '#c9ab6e' : 'var(--ink-2)';
  sp.style.borderColor = u.streak>=3 ? 'rgba(201,171,110,0.3)' : '';
  if (PS_EJ) PS_EJ._level = u.level;
}

function updateStats() {
  document.getElementById('ss-c').textContent = session.correct;
  document.getElementById('ss-w').textContent = session.wrong;
  document.getElementById('ss-x').textContent = session.xp;
  document.getElementById('ss-t').textContent = session.count;
  renderPoderesEj();
}

function nextQ() {
  if (session.count>0 && PS_EJ) PS_EJ.tick();
  renderPoderesEj();
  const u=Auth.me();
  const q=QEngine.getRandom(session.sub, u);
  const {options,correctIndex}=QEngine.shuffle(q);
  session.q=q; session.opts={options,correctIndex}; session.answered=false;
  session._noXP = !QEngine.givesXP(u, q.id);
  renderQ(q, options, correctIndex);
}

function renderQ(q, options, correctIndex) {
  const sub=SUBJECTS[q.subject], letters=['A','B','C','D'];
  const badge = session._noXP
    ? '<span style="font-family:var(--mono);font-size:.54rem;color:var(--ink-4);">⚠️ ya dominada</span>'
    : (PS_EJ&&PS_EJ.dobleLeft>0
        ? '<span style="font-family:var(--mono);font-size:.54rem;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">⚡ ×2 XP</span>'
        : '');
  const optsHTML = options.map((opt,i)=>`
    <button class="answer-option" onclick="pick(${i},${correctIndex})">
      <div class="option-letter">${letters[i]}</div><span>${opt}</span>
    </button>`).join('');
  document.getElementById('question-area').innerHTML=`
    <div class="card question-card">
      <div class="card-body">
        <div class="question-meta">
          <span class="subject-tag ${sub.tag}">${sub.icon} ${sub.label}</span>
          <span class="question-num">Q.${session.count+1} ${badge}</span>
        </div>
        <div class="question-text">${q.question}</div>
        <div class="options-list" id="opts">${optsHTML}</div>
        <div id="exp-area"></div>
        <div id="next-area" class="hidden" style="margin-top:12px;">
          <button class="btn btn-primary w-full" onclick="nextQ()">Siguiente →</button>
        </div>
      </div>
    </div>`;
}

function pick(sel, correct) {
  if (session.answered) return;
  session.answered=true; session.count++;
  const isOk=sel===correct, u=Auth.me();
  document.querySelectorAll('.answer-option').forEach((btn,i)=>{
    btn.disabled=true; btn.style.pointerEvents='none';
    if(i===correct) btn.classList.add('correct');
    if(i===sel&&!isOk) btn.classList.add('incorrect');
  });
  Progress.record(u, isOk, session.q.subject, session.q.id);
  if (typeof Pet!=='undefined') Pet.update(Auth.me());

  if (isOk) {
    session.correct++;
    const fresh=Auth.me();

    // Monedas: 1 por cada 5 correctas
    const coinResult = Economy.registrarCorrecta(Auth.me());
    if (coinResult.ganada) {
      const coinEl=document.createElement('div');
      coinEl.style.cssText='position:fixed;top:35%;left:50%;transform:translate(-50%,-50%);font-family:var(--serif);font-size:1.4rem;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;pointer-events:none;z-index:500;animation:xpFloat 1.5s ease forwards;filter:drop-shadow(0 0 8px rgba(22,115,255,0.5));';
      coinEl.textContent='🪙 +1 moneda';
      document.body.appendChild(coinEl); setTimeout(()=>coinEl.remove(),1500);
    }

    if (session._noXP) { showXP('⚠️ Sin XP'); Sound.correct(); }
    else {
      const bonus = fresh.streak>1 ? XP_STREAK_BONUS : 0;
      const base  = recompensaXP(fresh.level) + bonus;
      const xp    = PS_EJ&&PS_EJ.dobleLeft>0 ? base*2 : base;
      session.xp += xp;
      const leveled = Progress.addXP(Auth.me(), xp);
      Sound.correct();
      showXP('+'+xp+(bonus?' 🔥':'')+(PS_EJ&&PS_EJ.dobleLeft>0?' ⚡×2':''));
      if (leveled.length) setTimeout(()=>showLU(leveled.at(-1)),700);
    }
  } else {
    session.wrong++;
    if (PS_EJ&&PS_EJ.freezeOn) {
      PS_EJ.freezeOn=false;
      const f=Auth.me(); f.streak=(f.streak||0)+1; Auth.updateUser(f);
      flashPoderEj('❄️ Racha salvada','#60a5fa');
      Sound.beep(440,.14,'sine',.12);
    } else { Sound.incorrect(); }
  }

  Progress.checkAchievements(Auth.me()).forEach((a,i)=>setTimeout(()=>Notify.achievement(a),i*1400));
  updateStats(); updateHUD();
  document.getElementById('exp-area').innerHTML=`<div class="explanation-box ${isOk?'correct-exp':'incorrect-exp'}"><span class="exp-label">${isOk?'Correcto':'Incorrecto'}</span>${session.q.explanation}</div>`;
  document.getElementById('next-area').classList.remove('hidden');
}

function showXP(txt) {
  const el=document.createElement('div'); el.className='xp-reward'; el.textContent=txt;
  document.body.appendChild(el); setTimeout(()=>el.remove(),1500);
}
function showLU(level) {
  const r=Progress.getRank(level);
  document.getElementById('lu-num').textContent=level;
  document.getElementById('lu-rank').textContent=r.label+' · Rango '+r.rank;
  const c=document.getElementById('lu-particles'); c.innerHTML='';
  for(let i=0;i<18;i++){const p=document.createElement('div');p.className='lp';p.style.left='50%';p.style.top='50%';const ang=Math.random()*360*(Math.PI/180),d=60+Math.random()*160;p.style.setProperty('--dest','translate('+Math.cos(ang)*d+'px,'+Math.sin(ang)*d+'px)');p.style.animationDuration=(0.5+Math.random()*.7)+'s';p.style.background=Math.random()>.5?'#1673ff':'#ea00ff';c.appendChild(p);}
  document.getElementById('levelup-overlay').classList.remove('hidden');
  Sound.levelUp();
}
function closeLU() { document.getElementById('levelup-overlay').classList.add('hidden'); }
function goBack() { Sound.click(); window.location.href='main.html'; }

document.addEventListener('keydown', e=>{
  if (session.answered) { if(e.key==='Enter'||e.key===' ') nextQ(); return; }
  const map={'1':0,'2':1,'3':2,'4':3,'a':0,'b':1,'c':2,'d':3};
  const idx=map[e.key.toLowerCase()];
  if (idx!==undefined) { const btns=document.querySelectorAll('.answer-option'); if(btns[idx]&&!btns[idx].disabled) btns[idx].click(); }
  if (e.key==='q'||e.key==='Q') usarPoderEj('freeze');
  if (e.key==='w'||e.key==='W') usarPoderEj('doble');
});

init();
</script>
</body>
</html>
