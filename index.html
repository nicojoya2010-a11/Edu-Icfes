<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edu-Icfes — Acceso</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="notification-container"></div>

<div class="auth-wrapper">
  <div class="auth-box animate-in">

    <div class="auth-brand">
      <div class="auth-brand-title">Edu-Icfes</div>
      <div class="auth-brand-sub">Sistema de nivelación · v3.0</div>
      <div class="brand-line"></div>
    </div>

    <div class="card">
      <div class="card-body" style="padding:24px;">

        <div class="auth-tabs" id="auth-tabs">
          <button class="auth-tab active" onclick="switchTab('login')">Iniciar sesión</button>
          <button class="auth-tab" onclick="switchTab('register')">Registrarse</button>
        </div>

        <!-- LOGIN -->
        <form id="form-login" class="auth-form" onsubmit="handleLogin(event)">
          <div class="form-error" id="login-error"></div>
          <div class="input-group">
            <label class="input-label">Correo electrónico</label>
            <input class="input-field" id="login-email" type="email"
              placeholder="correo@ejemplo.com" autocomplete="email" required>
          </div>
          <div class="input-group">
            <label class="input-label">Contraseña</label>
            <input class="input-field" id="login-pass" type="password"
              placeholder="••••••••" autocomplete="current-password" required>
          </div>
          <button type="submit" class="btn btn-primary w-full" id="btn-login">
            Entrar
          </button>
          <div style="text-align:center;">
            <button type="button" class="recover-link" onclick="switchTab('recover')">
              ¿Olvidaste tu contraseña?
            </button>
          </div>
        </form>

        <!-- REGISTER -->
        <form id="form-register" class="auth-form hidden" onsubmit="handleRegister(event)">
          <div class="form-error" id="register-error"></div>
          <div class="input-group">
            <label class="input-label">Nombre para mostrar</label>
            <input class="input-field" id="reg-name" type="text"
              placeholder="Tu nombre" maxlength="24" required>
          </div>
          <div class="input-group">
            <label class="input-label">Correo electrónico</label>
            <input class="input-field" id="reg-email" type="email"
              placeholder="correo@ejemplo.com" autocomplete="email" required>
          </div>
          <div class="input-group">
            <label class="input-label">Contraseña</label>
            <input class="input-field" id="reg-pass" type="password"
              placeholder="mínimo 6 caracteres" autocomplete="new-password" required>
          </div>
          <div class="input-group">
            <label class="input-label">Confirmar contraseña</label>
            <input class="input-field" id="reg-pass2" type="password"
              placeholder="repite tu contraseña" required>
          </div>
          <button type="submit" class="btn btn-amber w-full" id="btn-register">
            Crear cuenta
          </button>
        </form>

        <!-- RECOVER -->
        <div id="form-recover" class="auth-form hidden">
          <div class="form-error" id="recover-error"></div>
          <div class="form-success hidden" id="recover-success"
            style="background:var(--green-lt);border:1px solid rgba(39,169,109,0.3);border-left:3px solid var(--green);color:#34d399;font-family:var(--mono);font-size:.72rem;padding:10px 14px;border-radius:var(--radius-xs);line-height:1.5;">
          </div>
          <p style="font-family:var(--mono);font-size:.7rem;color:var(--ink-3);margin-bottom:14px;line-height:1.6;">
            Ingresa tu correo y te enviaremos un enlace para restablecer tu contraseña.
          </p>
          <div class="input-group" style="margin-bottom:12px;">
            <label class="input-label">Correo electrónico</label>
            <input class="input-field" id="rec-email" type="email" placeholder="correo@ejemplo.com">
          </div>
          <button class="btn btn-amber w-full" onclick="handleRecover()">
            Enviar enlace
          </button>
          <button class="btn btn-ghost w-full" style="margin-top:6px;font-size:.82rem;" onclick="switchTab('login')">
            ← Volver al login
          </button>
        </div>

      </div>
    </div>

    <!-- Preview stats -->
    <div class="auth-preview">
      <div class="auth-preview-item">
        <span class="auth-preview-num">640</span>
        <span class="auth-preview-lbl">Preguntas</span>
      </div>
      <div class="auth-preview-item">
        <span class="auth-preview-num">5</span>
        <span class="auth-preview-lbl">Materias</span>
      </div>
      <div class="auth-preview-item">
        <span class="auth-preview-num">19</span>
        <span class="auth-preview-lbl">Logros</span>
      </div>
    </div>

  </div>
</div>

<script src="preguntas.js"></script>
<script src="app.js"></script>
<script>
  redirectIfLogged();

  function switchTab(tab) {
    ['login','register','recover'].forEach(t=>{
      document.getElementById('form-'+t).classList.toggle('hidden', t!==tab);
    });
    document.querySelectorAll('#auth-tabs .auth-tab').forEach((btn,i)=>{
      btn.classList.toggle('active',['login','register'][i]===tab);
    });
    clearErrors();
  }

  function clearErrors() {
    document.querySelectorAll('.form-error').forEach(e=>{e.classList.remove('visible');e.textContent='';});
    const s=document.getElementById('recover-success');
    if(s){s.classList.add('hidden');s.textContent='';}
  }
  function showErr(id, msg) {
    const el=document.getElementById(id);
    el.textContent=msg; el.classList.add('visible');
  }

  /* ── LOGIN ── */
  async function handleLogin(e) {
    e.preventDefault(); clearErrors();
    const email = document.getElementById('login-email').value.trim();
    const pass  = document.getElementById('login-pass').value;
    const btn   = document.getElementById('btn-login');
    btn.disabled=true; btn.textContent='Verificando...';
    const res = await Auth.loginAsync(email, pass);
    btn.disabled=false; btn.textContent='Entrar';
    if (res.ok) {
      Sound.click();
      setTimeout(()=>window.location.href='main.html', 400);
    } else {
      showErr('login-error', res.error);
    }
  }

  /* ── REGISTER ── */
  async function handleRegister(e) {
    e.preventDefault(); clearErrors();
    const name  = document.getElementById('reg-name').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const pass  = document.getElementById('reg-pass').value;
    const pass2 = document.getElementById('reg-pass2').value;
    if (pass !== pass2) { showErr('register-error','Las contraseñas no coinciden.'); return; }
    const btn = document.getElementById('btn-register');
    btn.disabled=true; btn.textContent='Creando cuenta...';
    const res = await Auth.register(email, name, pass);
    btn.disabled=false; btn.textContent='Crear cuenta';
    if (res.ok) {
      Sound.click();
      Notify.success('¡Bienvenido a Edu-Icfes!');
      setTimeout(()=>window.location.href='main.html', 600);
    } else {
      showErr('register-error', res.error);
    }
  }

  /* ── RECOVER ── */
  async function handleRecover() {
    clearErrors();
    const email = document.getElementById('rec-email').value.trim();
    if (!email) { showErr('recover-error','Ingresa tu correo.'); return; }
    const res = await Auth.resetPassword(email);
    if (res.ok) {
      const s=document.getElementById('recover-success');
      s.textContent='✓ Correo enviado a '+email+'. Revisa tu bandeja de entrada (y spam).';
      s.classList.remove('hidden');
      Sound.click();
    } else {
      showErr('recover-error', res.error);
    }
  }
</script>
</body>
</html>
