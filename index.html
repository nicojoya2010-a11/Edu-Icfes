<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edu Icfes — Iniciar Sesión</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Notification container -->
<div id="notification-container"></div>

<!-- Floating particles -->
<div id="particles"></div>

<div class="auth-wrapper">
  <div class="auth-container animate-in">
    <div class="brand-header">
      <div class="brand-logo">NEXUS</div>
      <div class="brand-logo" style="font-size:1rem; margin-top:-6px; letter-spacing:0.5em;">ACADEMY</div>
      <div class="brand-divider"><span>Nivelacion Educativa</span></div>
      <div class="brand-sub">Sistema de Entrenamiento v1.0</div>
    </div>

    <div class="panel" style="padding:28px;">
      <div class="corner-tl"></div>
      <div class="corner-tr"></div>
      <div class="corner-bl"></div>
      <div class="corner-br"></div>


      <div class="tab-bar">
        <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">
          ▶ INICIAR SESIÓN
        </button>
        <button class="tab-btn" id="tab-register" onclick="switchTab('register')">
          ✦ REGISTRARSE
        </button>
      </div>

      <form id="form-login" class="auth-form" onsubmit="handleLogin(event)">
        <div class="form-error" id="login-error"></div>

        <div class="input-group">
          <label class="input-label">// Usuario</label>
          <input type="text" class="input-field" id="login-user"
                 placeholder="tu_usuario" autocomplete="username" required>
        </div>

        <div class="input-group">
          <label class="input-label">// Contraseña</label>
          <input type="password" class="input-field" id="login-pass"
                 placeholder="••••••••" autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn btn-primary w-full" style="margin-top:8px;">
          ▶ ACCEDER AL SISTEMA
        </button>
      </form>
      <form id="form-register" class="auth-form hidden" onsubmit="handleRegister(event)">
        <div class="form-error" id="register-error"></div>

        <div class="input-group">
          <label class="input-label">// Nombre de jugador</label>
          <input type="text" class="input-field" id="reg-name"
                 placeholder="Tu nombre" maxlength="24" required>
        </div>

        <div class="input-group">
          <label class="input-label">// Usuario único</label>
          <input type="text" class="input-field" id="reg-user"
                 placeholder="usuario123" maxlength="20" autocomplete="username" required>
        </div>

        <div class="input-group">
          <label class="input-label">// Contraseña</label>
          <input type="password" class="input-field" id="reg-pass"
                 placeholder="mínimo 4 caracteres" autocomplete="new-password" required>
        </div>

        <button type="submit" class="btn btn-gold w-full" style="margin-top:8px;">
          ✦ CREAR PERSONAJE
        </button>
      </form>
    </div>

    <!-- Stats preview -->
    <div class="stat-preview" id="stats-preview">
      <div class="stat-preview-item">
        <span class="stat-preview-num" id="stat-questions">—</span>
        <span class="stat-preview-label">Preguntas</span>
      </div>
      <div class="stat-preview-item">
        <span class="stat-preview-num" id="stat-subjects">5</span>
        <span class="stat-preview-label">Materias</span>
      </div>
      <div class="stat-preview-item">
        <span class="stat-preview-num" id="stat-achievements">—</span>
        <span class="stat-preview-label">Logros</span>
      </div>
    </div>

  </div>
</div>

<script src="app.js"></script>
<script>
  // ── Redirect if already logged in ──
  redirectIfLoggedIn();

  // ── Tab switching ──
  function switchTab(tab) {
    const isLogin = tab === 'login';
    document.getElementById('form-login').classList.toggle('hidden', !isLogin);
    document.getElementById('form-register').classList.toggle('hidden', isLogin);
    document.getElementById('tab-login').classList.toggle('active', isLogin);
    document.getElementById('tab-register').classList.toggle('active', !isLogin);
    clearErrors();
  }

  function clearErrors() {
    $$('.form-error').forEach(e => { e.classList.remove('visible'); e.textContent = ''; });
  }

  function showError(id, msg) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.classList.add('visible');
  }

  // ── Login handler ──
  function handleLogin(e) {
    e.preventDefault();
    clearErrors();
    const user = document.getElementById('login-user').value.trim();
    const pass = document.getElementById('login-pass').value;
    const result = Auth.login(user, pass);
    if (result.ok) {
      Notify.success('✓ Sesión iniciada. Bienvenido de vuelta.');
      Sound.click();
      setTimeout(() => { window.location.href = 'main.html'; }, 600);
    } else {
      showError('login-error', '✗ ' + result.error);
    }
  }

  // ── Register handler ──
  function handleRegister(e) {
    e.preventDefault();
    clearErrors();
    const name = document.getElementById('reg-name').value.trim();
    const user = document.getElementById('reg-user').value.trim().toLowerCase();
    const pass = document.getElementById('reg-pass').value;
    const result = Auth.register(user, name, pass);
    if (result.ok) {
      Notify.success('✓ Personaje creado. ¡Bienvenido a Nexus Academy!');
      Sound.click();
      setTimeout(() => { window.location.href = 'main.html'; }, 600);
    } else {
      showError('register-error', '✗ ' + result.error);
    }
  }

  // ── Stats ──
  document.getElementById('stat-questions').textContent = QUESTIONS.length;
  document.getElementById('stat-achievements').textContent = ACHIEVEMENTS.length;

  // ── Floating particles ──
  const chars = '01アイウエオカキクSYSTEMDATALOADED0110';
  const pContainer = document.getElementById('particles');
  for (let i = 0; i < 18; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = Array.from({length: Math.floor(Math.random() * 6) + 2}, () =>
      chars[Math.floor(Math.random() * chars.length)]
    ).join('');
    p.style.left = Math.random() * 100 + 'vw';
    p.style.animationDuration = (8 + Math.random() * 12) + 's';
    p.style.animationDelay = -(Math.random() * 20) + 's';
    pContainer.appendChild(p);
  }
</script>
</body>
</html>
