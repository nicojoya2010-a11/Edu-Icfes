<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edu-Icfes — Iniciar Sesión</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="notification-container"></div>
<div id="particles"></div>

<div class="auth-wrapper">
  <div class="auth-container animate-in">
    <div class="brand-header">
      <div class="brand-logo">EDU</div>
      <div class="brand-logo" style="font-size:1rem;margin-top:-6px;letter-spacing:0.5em;">ICFES</div>
      <div class="brand-divider"><span>Nivelación Educativa</span></div>
      <div class="brand-sub">Sistema de Entrenamiento v1.0</div>
    </div>

    <div class="panel" style="padding:28px;">
      <div class="corner-tl"></div><div class="corner-tr"></div>
      <div class="corner-bl"></div><div class="corner-br"></div>

      <div class="tab-bar">
        <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">▶ INICIAR SESIÓN</button>
        <button class="tab-btn" id="tab-register" onclick="switchTab('register')">✦ REGISTRARSE</button>
        <button class="tab-btn" id="tab-recover" onclick="switchTab('recover')" style="font-size:0.6rem;">🔑 RECUPERAR</button>
      </div>

      <!-- LOGIN -->
      <form id="form-login" class="auth-form" onsubmit="handleLogin(event)">
        <div class="form-error" id="login-error"></div>
        <div class="input-group">
          <label class="input-label">// Usuario</label>
          <input type="text" class="input-field" id="login-user" placeholder="tu_usuario" autocomplete="username" required>
        </div>
        <div class="input-group">
          <label class="input-label">// Contraseña</label>
          <input type="password" class="input-field" id="login-pass" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary w-full" style="margin-top:8px;">▶ ACCEDER AL SISTEMA</button>
        <div style="text-align:center;margin-top:10px;">
          <button type="button" onclick="switchTab('recover')"
            style="background:none;border:none;color:var(--text-muted);font-family:var(--font-mono);font-size:0.65rem;cursor:pointer;text-decoration:underline;">
            ¿Olvidaste tu contraseña?
          </button>
        </div>
      </form>

      <!-- REGISTER -->
      <form id="form-register" class="auth-form hidden" onsubmit="handleRegister(event)">
        <div class="form-error" id="register-error"></div>
        <div class="input-group">
          <label class="input-label">// Nombre de jugador</label>
          <input type="text" class="input-field" id="reg-name" placeholder="Tu nombre" maxlength="24" required>
        </div>
        <div class="input-group">
          <label class="input-label">// Usuario único</label>
          <input type="text" class="input-field" id="reg-user" placeholder="usuario123" maxlength="20" autocomplete="username" required>
        </div>
        <div class="input-group">
          <label class="input-label">// Contraseña</label>
          <input type="password" class="input-field" id="reg-pass" placeholder="mínimo 4 caracteres" autocomplete="new-password" required>
        </div>
        <div class="input-group">
          <label class="input-label">// Pregunta de seguridad</label>
          <select class="input-field" id="reg-sec-question" required style="cursor:pointer;">
            <option value="">— Selecciona una pregunta —</option>
            <option value="¿Cuál es el nombre de tu mascota favorita?">¿Cuál es el nombre de tu mascota favorita?</option>
            <option value="¿En qué ciudad naciste?">¿En qué ciudad naciste?</option>
            <option value="¿Cuál es el nombre de tu mejor amigo de infancia?">¿Cuál es el nombre de tu mejor amigo de infancia?</option>
            <option value="¿Cuál es tu comida favorita?">¿Cuál es tu comida favorita?</option>
            <option value="¿Cuál es el nombre de tu colegio?">¿Cuál es el nombre de tu colegio?</option>
            <option value="¿Cuál es tu película favorita?">¿Cuál es tu película favorita?</option>
          </select>
        </div>
        <div class="input-group">
          <label class="input-label">// Respuesta secreta</label>
          <input type="text" class="input-field" id="reg-sec-answer" placeholder="Tu respuesta" maxlength="40" required>
        </div>
        <button type="submit" class="btn btn-gold w-full" style="margin-top:8px;">✦ CREAR PERSONAJE</button>
      </form>

      <!-- RECOVER -->
      <div id="form-recover" class="auth-form hidden">
        <div class="form-error" id="recover-error"></div>
        <div id="recover-step1">
          <div style="font-family:var(--font-mono);font-size:0.7rem;color:var(--text-muted);margin-bottom:14px;">
            Ingresa tu usuario para ver tu pregunta de seguridad.
          </div>
          <div class="input-group">
            <label class="input-label">// Tu usuario</label>
            <input type="text" class="input-field" id="rec-user" placeholder="usuario123">
          </div>
          <button class="btn btn-primary w-full" style="margin-top:8px;" onclick="recoverStep1()">▶ BUSCAR USUARIO</button>
        </div>
        <div id="recover-step2" class="hidden">
          <div style="font-family:var(--font-mono);font-size:0.7rem;color:var(--accent-cyan);margin-bottom:6px;">Pregunta de seguridad:</div>
          <div id="rec-question-text" style="font-family:var(--font-mono);font-size:0.8rem;color:var(--text-secondary);margin-bottom:14px;padding:10px;background:rgba(0,212,255,0.05);border-radius:4px;border:1px solid var(--border-dim);"></div>
          <div class="input-group">
            <label class="input-label">// Tu respuesta</label>
            <input type="text" class="input-field" id="rec-answer" placeholder="Respuesta secreta">
          </div>
          <div class="input-group">
            <label class="input-label">// Nueva contraseña</label>
            <input type="password" class="input-field" id="rec-newpass" placeholder="mínimo 4 caracteres">
          </div>
          <button class="btn btn-gold w-full" style="margin-top:8px;" onclick="recoverStep2()">✦ CAMBIAR CONTRASEÑA</button>
          <button onclick="resetRecover()" style="background:none;border:none;color:var(--text-muted);font-family:var(--font-mono);font-size:0.65rem;cursor:pointer;margin-top:10px;text-decoration:underline;display:block;text-align:center;">← Volver</button>
        </div>
      </div>

    </div>

    <div class="stat-preview" id="stats-preview">
      <div class="stat-preview-item">
        <span class="stat-preview-num" id="stat-questions">—</span>
        <span class="stat-preview-label">Preguntas</span>
      </div>
      <div class="stat-preview-item">
        <span class="stat-preview-num" id="stat-subjects">5</span>
        <span class="stat-preview-label">Materias</span>
      </div>
      <div class="stat-preview-item">
        <span class="stat-preview-num" id="stat-achievements">—</span>
        <span class="stat-preview-label">Logros</span>
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
  redirectIfLoggedIn();

  function switchTab(tab) {
    ['login','register','recover'].forEach(t => {
      document.getElementById('form-'+t).classList.toggle('hidden', t !== tab);
      document.getElementById('tab-'+t).classList.toggle('active', t === tab);
    });
    clearErrors();
  }

  function clearErrors() {
    $$('.form-error').forEach(e => { e.classList.remove('visible'); e.textContent = ''; });
  }

  function showError(id, msg) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.classList.add('visible');
  }

  async function handleLogin(e) {
    e.preventDefault();
    clearErrors();
    const user = document.getElementById('login-user').value.trim();
    const pass = document.getElementById('login-pass').value;
    const btn  = e.submitter;
    if (btn) { btn.disabled = true; btn.textContent = '⏳ Verificando...'; }
    const result = await Auth.loginAsync(user, pass);
    if (btn) { btn.disabled = false; btn.textContent = '▶ ACCEDER AL SISTEMA'; }
    if (result.ok) {
      Notify.success('Sesion iniciada. Bienvenido!');
      Sound.click();
      setTimeout(() => { window.location.href = 'main.html'; }, 600);
    } else {
      showError('login-error', result.error);
    }
  }

  function handleRegister(e) {
    e.preventDefault();
    clearErrors();
    const name = document.getElementById('reg-name').value.trim();
    const user = document.getElementById('reg-user').value.trim().toLowerCase();
    const pass = document.getElementById('reg-pass').value;
    const secQ = document.getElementById('reg-sec-question').value;
    const secA = document.getElementById('reg-sec-answer').value.trim();
    const result = Auth.register(user, name, pass, secQ, secA);
    if (result.ok) {
      Notify.success('✓ Personaje creado. ¡Bienvenido a Edu-Icfes!');
      Sound.click();
      setTimeout(() => { window.location.href = 'main.html'; }, 600);
    } else {
      showError('register-error', '✗ ' + result.error);
    }
  }

  function recoverStep1() {
    clearErrors();
    const username = document.getElementById('rec-user').value.trim().toLowerCase();
    const result = Auth.getSecQuestion(username);
    if (!result.ok) { showError('recover-error', '✗ ' + result.error); return; }
    if (!result.question) { showError('recover-error', '✗ Este usuario no tiene pregunta de seguridad.'); return; }
    document.getElementById('rec-question-text').textContent = result.question;
    document.getElementById('recover-step1').classList.add('hidden');
    document.getElementById('recover-step2').classList.remove('hidden');
  }

  function recoverStep2() {
    clearErrors();
    const username = document.getElementById('rec-user').value.trim().toLowerCase();
    const answer   = document.getElementById('rec-answer').value.trim();
    const newPass  = document.getElementById('rec-newpass').value;
    const result   = Auth.resetPassword(username, answer, newPass);
    if (result.ok) {
      Notify.success('✓ Contraseña cambiada. Ya puedes iniciar sesión.');
      Sound.click();
      resetRecover();
      switchTab('login');
    } else {
      showError('recover-error', '✗ ' + result.error);
    }
  }

  function resetRecover() {
    document.getElementById('recover-step1').classList.remove('hidden');
    document.getElementById('recover-step2').classList.add('hidden');
    ['rec-user','rec-answer','rec-newpass'].forEach(id => document.getElementById(id).value = '');
  }

  document.getElementById('stat-questions').textContent = QUESTIONS.length;
  document.getElementById('stat-achievements').textContent = ACHIEVEMENTS.length;

  const chars = '01アイウエオカキクEDUIICFES0110';
  const pContainer = document.getElementById('particles');
  for (let i = 0; i < 18; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = Array.from({length: Math.floor(Math.random() * 6) + 2}, () =>
      chars[Math.floor(Math.random() * chars.length)]).join('');
    p.style.left = Math.random() * 100 + 'vw';
    p.style.animationDuration = (8 + Math.random() * 12) + 's';
    p.style.animationDelay = -(Math.random() * 20) + 's';
    pContainer.appendChild(p);
  }
</script>
</body>
</html>
