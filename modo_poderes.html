<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edu-Icfes — Modo Poderes</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .poderes-barra {
      display:flex; gap:8px; padding:12px 16px;
      background:var(--bg-card); border:1px solid var(--border);
      border-radius:var(--radius-sm); align-items:center; margin-bottom:10px;
    }
    .poderes-label { font-family:var(--mono); font-size:.58rem; color:var(--ink-4); letter-spacing:.12em; text-transform:uppercase; flex-shrink:0; }
    .poder-btn {
      display:flex; flex-direction:column; align-items:center; gap:3px;
      padding:8px 10px; border-radius:var(--radius-xs); cursor:pointer;
      transition:var(--transition); border:1px solid; flex:1; background:var(--bg); position:relative;
    }
    .poder-btn:hover:not(:disabled) { transform:translateY(-2px); box-shadow:var(--shadow-sm); }
    .poder-btn:active:not(:disabled) { transform:scale(.96); }
    .poder-btn:disabled { opacity:.35; cursor:not-allowed; }
    .poder-icon { font-size:1.3rem; line-height:1; }
    .poder-name { font-family:var(--mono); font-size:.52rem; letter-spacing:.04em; text-align:center; }
    .poder-dots { display:flex; gap:3px; }
    .poder-dot  { width:5px; height:5px; border-radius:50%; transition:background .3s; }
    .poder-cd   { font-family:var(--mono); font-size:.48rem; color:var(--ink-4); }
    .poder-key  { font-family:var(--mono); font-size:.42rem; color:var(--ink-4); opacity:.6; }
    .poder-lock { position:absolute; top:4px; right:5px; font-size:.55rem; }
    .poder-active-bar { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; min-height:24px; }
    .active-pill { display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:20px; font-family:var(--mono); font-size:.62rem; animation:fadeIn .3s ease; }
    .pill-freeze { background:#e0f2fe; border:1px solid #7dd3fc; color:#0369a1; }
    .pill-2xp    { background:#fef9c3; border:1px solid var(--amber-lt); color:#a16207; animation:pulse 1s ease-in-out infinite; }
    .poder-flash { position:fixed; top:38%; left:50%; transform:translate(-50%,-50%); font-family:var(--serif); font-size:1.6rem; pointer-events:none; z-index:500; animation:poderFloat 1.7s ease forwards; white-space:nowrap; }
    @keyframes poderFloat { 0%{opacity:0;transform:translate(-50%,-30%) scale(.9);} 15%{opacity:1;transform:translate(-50%,-50%) scale(1.05);} 70%{opacity:1;transform:translate(-50%,-65%);} 100%{opacity:0;transform:translate(-50%,-90%);} }
    .mp-badge { display:inline-flex; align-items:center; gap:5px; font-family:var(--mono); font-size:.6rem; color:var(--amber); padding:2px 8px; background:var(--amber-bg); border:1px solid var(--amber-lt); border-radius:20px; }
  </style>
</head>
<body>
<div id="notification-container"></div>
<div id="levelup-overlay" class="levelup-overlay hidden">
  <div class="levelup-particles" id="lu-particles"></div>
  <div class="levelup-title">Nivel alcanzado</div>
  <div class="levelup-number" id="lu-num">2</div>
  <div class="levelup-rank" id="lu-rank"></div>
  <button class="btn btn-outline" style="margin-top:20px;color:var(--bg);border-color:rgba(255,255,255,.3);" onclick="closeLU()">Continuar →</button>
</div>
 
<div class="page-wrapper">
  <div class="exercise-topbar">
    <button class="back-btn" onclick="goBack()">Base</button>
    <div class="mini-xp-bar"><div class="mini-xp-fill" id="mini-xp" style="width:0%"></div></div>
    <div class="mini-level" id="mini-level">Nv.1</div>
    <div id="streak-display" class="streak-pill">🔥 0</div>
  </div>
 
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
    <h2 style="font-size:1.3rem;">Modo <em style="color:var(--amber);">Poderes</em></h2>
    <span class="mp-badge">⚡ Entrenamiento</span>
  </div>
 
  <div class="session-stats" style="margin-bottom:10px;">
    <div class="session-stat"><span class="session-stat-val" id="ss-c" style="color:var(--green);">0</span><span class="session-stat-lbl">✓ Ok</span></div>
    <div class="session-stat"><span class="session-stat-val" id="ss-w" style="color:var(--red);">0</span><span class="session-stat-lbl">✗ Fallo</span></div>
    <div class="session-stat"><span class="session-stat-val" id="ss-x" style="color:var(--amber);">0</span><span class="session-stat-lbl">XP</span></div>
    <div class="session-stat"><span class="session-stat-val" id="ss-p" style="color:var(--ink-3);">0</span><span class="session-stat-lbl">Poderes</span></div>
  </div>
 
  <div class="poder-active-bar" id="active-bar"></div>
 
  <div class="poderes-barra">
    <div class="poderes-label">Poderes</div>
    <div style="display:flex;gap:6px;flex:1;" id="poderes-container"></div>
  </div>
 
  <div id="question-area"></div>
</div>
 
<script src="preguntas.js"></script>
<script src="app.js"></script>
<script>
'use strict';
const mpUser = requireAuth();
if (!mpUser) throw new Error('no auth');
if (mpUser.level < 10) {
  alert('Modo Poderes requiere nivel 10. Nivel actual: '+mpUser.level);
  window.location.href='main.html';
  throw new Error('nivel insuficiente');
}
 
const PDEFS_MP = [
  { id:'freeze', icon:'❄️', name:'Racha\nCongelada', key:'Q', color:'#0369a1', bg:'#e0f2fe', border:'#7dd3fc', maxCrg:2, cdPregs:4, reqLevel:10, desc:'Protege tu racha en la próxima respuesta incorrecta' },
  { id:'doble',  icon:'⚡', name:'Doble XP',         key:'W', color:'#a16207', bg:'#fef9c3', border:'#fde68a', maxCrg:1, cdPregs:6, reqLevel:20, desc:'Dobla el XP en las próximas 3 preguntas correctas' },
];
 
let session = { correct:0, wrong:0, xp:0, count:0, poderes:0, answered:false, q:null, opts:null, _noXP:false };
 
const PS = {
  cargas:    { freeze: 2+Math.floor(mpUser.level/8), doble: 1+Math.floor(mpUser.level/15) },
  cds:       { freeze:0, doble:0 },
  desde:     { freeze:99, doble:99 },
  freezeOn:  false,
  dobleLeft: 0,
  puedo(id) {
    const def = PDEFS_MP.find(p=>p.id===id);
    if (!def || mpUser.level < def.reqLevel) return false;
    return this.cargas[id]>0 && this.cds[id]===0 && !session.answered;
  },
  usar(id) {
    if (!this.puedo(id)) return false;
    this.cargas[id]--; this.desde[id]=0;
    this.cds[id] = {freeze:4,doble:6}[id];
    session.poderes++; return true;
  },
  tick() {
    ['freeze','doble'].forEach(id=>{
      this.desde[id]++;
      this.cds[id] = this.desde[id]>={freeze:4,doble:6}[id] ? 0 : {freeze:4,doble:6}[id]-this.desde[id];
    });
    if (this.dobleLeft>0) this.dobleLeft--;
  },
};
 
function init() { updateHUD(); renderPoderes(); renderActiveBars(); nextQ(); }
 
function updateHUD() {
  const u=Auth.me();
  document.getElementById('mini-xp').style.width=Progress.xpPct(u)+'%';
  document.getElementById('mini-level').textContent='Nv.'+u.level;
  if (!PS.freezeOn) {
    const sp=document.getElementById('streak-display');
    sp.textContent='🔥 '+(u.streak||0); sp.className='streak-pill'+(u.streak>=3?' hot':'');
  }
  document.getElementById('ss-c').textContent=session.correct;
  document.getElementById('ss-w').textContent=session.wrong;
  document.getElementById('ss-x').textContent=session.xp;
  document.getElementById('ss-p').textContent=session.poderes;
}
 
function renderActiveBars() {
  const pills=[];
  if (PS.freezeOn)    pills.push(`<span class="active-pill pill-freeze">❄️ Racha protegida</span>`);
  if (PS.dobleLeft>0) pills.push(`<span class="active-pill pill-2xp">⚡ Doble XP ×${PS.dobleLeft}</span>`);
  document.getElementById('active-bar').innerHTML=pills.join('');
}
 
function renderPoderes() {
  document.getElementById('poderes-container').innerHTML=PDEFS_MP.map(p=>{
    const locked=mpUser.level<p.reqLevel;
    const crg=PS.cargas[p.id], cd=PS.cds[p.id];
    const ok=PS.puedo(p.id);
    const actv=(p.id==='freeze'&&PS.freezeOn)||(p.id==='doble'&&PS.dobleLeft>0);
    const dots=Array.from({length:p.maxCrg},(_,i)=>`<div class="poder-dot" style="background:${i<crg?p.color:'var(--border)'}"></div>`).join('');
    const cdTxt=locked?'':cd>0?`<div class="poder-cd">CD:${cd}</div>`:crg===0&&!actv?`<div class="poder-cd">agotado</div>`:'';
    return `<button class="poder-btn" id="pb-${p.id}"
      style="border-color:${actv||ok?p.border:'var(--border)'};background:${actv||ok?p.bg:'var(--bg)'};"
      onclick="usarPoder('${p.id}')" ${ok&&!locked?'':'disabled'} title="${p.desc}">
      ${locked?`<div class="poder-lock">🔒</div>`:''}
      <div class="poder-key">[${p.key}]</div>
      <div class="poder-icon">${p.icon}</div>
      <div class="poder-name" style="color:${actv||ok?p.color:'var(--ink-4)'};">${locked?'Nv.'+p.reqLevel:p.name}</div>
      <div class="poder-dots">${dots}</div>${cdTxt}
    </button>`;
  }).join('');
}
 
function usarPoder(id) {
  const def=PDEFS_MP.find(p=>p.id===id);
  if (!PS.puedo(id)) {
    Notify.warning(def.icon+' '+(PS.cds[id]>0?'CD: '+PS.cds[id]+' preg.':mpUser.level<def.reqLevel?'Nivel '+def.reqLevel+' req.':'Sin cargas'));
    return;
  }
  PS.usar(id);
  if (id==='freeze') { PS.freezeOn=true; flashPoder('❄️ ¡Racha Congelada!','#0369a1'); Sound.beep(440,.1,'sine',.1); setTimeout(()=>Sound.beep(330,.12,'sine',.1),100); }
  if (id==='doble')  { PS.dobleLeft=3; flashPoder('⚡ ¡Doble XP × 3!','#a16207'); Sound.beep(660,.08,'square',.1); setTimeout(()=>Sound.beep(880,.1,'square',.1),80); }
  renderPoderes(); renderActiveBars();
}
 
function flashPoder(txt,color) { const el=document.createElement('div'); el.className='poder-flash'; el.style.color=color; el.textContent=txt; document.body.appendChild(el); setTimeout(()=>el.remove(),1700); }
 
function nextQ() {
  if (session.count>0) PS.tick();
  renderPoderes(); renderActiveBars();
  const u=Auth.me();
  const q=QEngine.getRandom(null,u);
  const {options,correctIndex}=QEngine.shuffle(q);
  session.q=q; session.opts={options,correctIndex}; session.answered=false;
  session._noXP=!QEngine.givesXP(u,q.id);
  renderQ(q,options,correctIndex);
}
 
function renderQ(q,options,correctIndex) {
  const sub=SUBJECTS[q.subject], letters=['A','B','C','D'];
  const badge=session._noXP?`<span style="font-family:var(--mono);font-size:.54rem;color:var(--ink-4);">⚠️ ya dominada</span>`:`<span class="mp-badge" style="font-size:.54rem;">${PS.dobleLeft>0?'⚡×2 XP':'+10 XP extra'}</span>`;
  document.getElementById('question-area').innerHTML=`
    <div class="card question-card" style="background:linear-gradient(135deg,rgba(22,115,255,0.25),rgba(234,0,255,0.18));box-shadow:var(--shadow-md),0 0 8px rgba(22,115,255,0.1);"><div class="card-body">
      <div class="question-meta">
        <span class="subject-tag ${sub.tag}">${sub.icon} ${sub.label}</span>
        <span class="question-num">Q.${session.count+1} · ${badge}</span>
      </div>
      <div class="question-text">${q.question}</div>
      <div class="options-list" id="opts">${options.map((opt,i)=>`
        <button class="answer-option" onclick="pick(${i},${correctIndex})">
          <div class="option-letter">${letters[i]}</div>${opt}
        </button>`).join('')}</div>
      <div id="exp-area"></div>
      <div id="next-area" class="hidden" style="margin-top:12px;">
        <button class="btn btn-primary w-full" onclick="nextQ()">Siguiente →</button>
      </div>
    </div></div>`;
}
 
function pick(sel,correct) {
  if (session.answered) return;
  session.answered=true; session.count++;
  const isOk=sel===correct, u=Auth.me();
  $$('.answer-option').forEach((btn,i)=>{ btn.disabled=true; btn.style.pointerEvents='none'; if(i===correct) btn.classList.add('correct'); if(i===sel&&!isOk) btn.classList.add('incorrect'); });
  Progress.record(u,isOk,session.q.subject,session.q.id);
  Pet.update(Auth.me());
  if (isOk) {
    session.correct++;
    const fresh=Auth.me();
    if (session._noXP) { showXP('⚠️ Sin XP'); Sound.correct(); }
    else {
      const bonus=fresh.streak>1?XP_STREAK_BONUS:0;
      const base=recompensaXP(fresh.level)+bonus+10;
      const xp=PS.dobleLeft>0?base*2:base;
      session.xp+=xp;
      const leveled=Progress.addXP(Auth.me(),xp);
      Sound.correct(); showXP('+'+xp+(bonus?' 🔥':'')+(PS.dobleLeft>0?' ⚡×2':''));
      if (leveled.length) setTimeout(()=>showLU(leveled.at(-1)),700);
    }
  } else {
    session.wrong++;
    if (PS.freezeOn) {
      PS.freezeOn=false;
      const f=Auth.me(); f.streak=(f.streak||0)+1; Auth.updateUser(f);
      document.getElementById('streak-display').textContent='🔥'+f.streak;
      document.getElementById('streak-display').className='streak-pill hot';
      flashPoder('❄️ Racha salvada','#0369a1');
      Sound.beep(440,.14,'sine',.12);
    } else { Sound.incorrect(); }
  }
  Progress.checkAchievements(Auth.me()).forEach((a,i)=>setTimeout(()=>Notify.achievement(a),i*1400));
  updateHUD(); renderActiveBars();
  document.getElementById('exp-area').innerHTML=`<div class="explanation-box ${isOk?'correct-exp':'incorrect-exp'}"><span class="exp-label">${isOk?'Correcto':'Incorrecto'}</span>${session.q.explanation}</div>`;
  document.getElementById('next-area').classList.remove('hidden');
}
 
function showXP(txt) { const el=document.createElement('div'); el.className='xp-reward'; el.textContent=txt; document.body.appendChild(el); setTimeout(()=>el.remove(),1500); }
function showLU(lv) {
  const r=Progress.getRank(lv);
  document.getElementById('lu-num').textContent=lv; document.getElementById('lu-rank').textContent=r.label+' · Rango '+r.rank;
  const c=document.getElementById('lu-particles'); c.innerHTML='';
  for(let i=0;i<16;i++){const p=document.createElement('div');p.className='lp';p.style.left='50%';p.style.top='50%';const ang=Math.random()*360*(Math.PI/180),d=60+Math.random()*150;p.style.setProperty('--dest',`translate(${Math.cos(ang)*d}px,${Math.sin(ang)*d}px)`);p.style.animationDuration=(0.5+Math.random()*.7)+'s';p.style.background=Math.random()>.5?'var(--amber)':'#fff';c.appendChild(p);}
  document.getElementById('levelup-overlay').classList.remove('hidden');
  Sound.levelUp(); Notify.levelUp(lv,r.rank);
}
function closeLU() { document.getElementById('levelup-overlay').classList.add('hidden'); }
function goBack() { Sound.click(); window.location.href='main.html'; }
 
document.addEventListener('keydown',e=>{
  if (!session.answered) {
    const map={'1':0,'2':1,'3':2,'4':3,'a':0,'b':1,'c':2,'d':3};
    const idx=map[e.key.toLowerCase()];
    if (idx!==undefined) { const btns=$$('.answer-option'); if(btns[idx]&&!btns[idx].disabled) btns[idx].click(); }
    if (e.key==='q'||e.key==='Q') usarPoder('freeze');
    if (e.key==='w'||e.key==='W') usarPoder('doble');
  } else { if(e.key==='Enter'||e.key===' ') nextQ(); }
});
 
init();
</script>
</body>
</html>
